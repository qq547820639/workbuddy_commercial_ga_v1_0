apiVersion: v1
kind: Secret
metadata:
  name: workbuddy-secrets
  namespace: workbuddy
type: Opaque
stringData:
  WORKBUDDY_DATABASE_URL: postgresql+psycopg://USER:PASSWORD@HOST:5432/workbuddy
  WORKBUDDY_APP_SECRET: REPLACE_WITH_32_PLUS_RANDOM_CHARACTERS
  WORKBUDDY_TOKEN_ENCRYPTION_KEY: REPLACE_WITH_FERNET_KEY
  WORKBUDDY_AUTH_JWKS_URL: https://identity.example.com/.well-known/jwks.json
  WORKBUDDY_AUTH_OIDC_ISSUER: https://identity.example.com/
  WORKBUDDY_AUTH_OIDC_AUDIENCE: workbuddy-api
  WORKBUDDY_MODEL_API_KEY: REPLACE
  WORKBUDDY_GMAIL_CLIENT_ID: REPLACE
  WORKBUDDY_GMAIL_CLIENT_SECRET: REPLACE
  WORKBUDDY_GRAPH_CLIENT_ID: REPLACE
  WORKBUDDY_GRAPH_CLIENT_SECRET: REPLACE
  WORKBUDDY_GRAPH_WEBHOOK_CLIENT_STATE: REPLACE
