apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workbuddy-default-deny
  namespace: workbuddy
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workbuddy-api-ingress
  namespace: workbuddy
spec:
  podSelector: {matchLabels: {app: workbuddy-api}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workbuddy-required-egress
  namespace: workbuddy
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: []
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 5432}
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
