apiVersion: apps/v1
kind: Deployment
metadata:
  name: workbuddy-worker
  namespace: workbuddy
spec:
  replicas: 2
  selector:
    matchLabels: {app: workbuddy-worker}
  template:
    metadata:
      labels: {app: workbuddy-worker}
    spec:
      serviceAccountName: workbuddy
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: ghcr.io/workbuddy/workbuddy:1.0.0
          command: ["workbuddy-worker"]
          envFrom:
            - configMapRef: {name: workbuddy-config}
            - secretRef: {name: workbuddy-secrets}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
