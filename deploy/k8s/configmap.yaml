apiVersion: v1
kind: ConfigMap
metadata:
  name: workbuddy-config
  namespace: workbuddy
data:
  WORKBUDDY_ENVIRONMENT: production
  WORKBUDDY_AUTH_MODE: oidc
  WORKBUDDY_DISPATCH_SHADOW_MODE: "true"
  WORKBUDDY_ENABLE_LIVE_EMAIL_SEND: "false"
  WORKBUDDY_REQUIRE_PILOT_FOR_LIVE_SEND: "true"
  WORKBUDDY_OBJECT_STORE_PROVIDER: s3
  WORKBUDDY_DAILY_SEND_LIMIT: "20"
  WORKBUDDY_MISSION_SEND_LIMIT: "3"
  WORKBUDDY_ALLOW_BCC: "false"
  WORKBUDDY_ALLOW_ATTACHMENTS: "false"
