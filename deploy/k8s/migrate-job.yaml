apiVersion: batch/v1
kind: Job
metadata:
  name: workbuddy-migrate
  namespace: workbuddy
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/workbuddy/workbuddy:1.0.0
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: workbuddy-config}
            - secretRef: {name: workbuddy-secrets}
