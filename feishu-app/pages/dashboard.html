<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkBuddy · 专家团看板</title>
  <style>
    /* ===== 飞书 Design Tokens 风格变量 ===== */
    :root {
      --wb-primary: #3370ff;
      --wb-primary-hover: #2860e6;
      --wb-primary-bg: #e8f0ff;
      --wb-bg: #f5f6f7;
      --wb-card-bg: #ffffff;
      --wb-text-1: #1d2129;
      --wb-text-2: #4e5969;
      --wb-text-3: #86909c;
      --wb-border: #f0f1f2;
      --wb-border-2: #e5e6eb;
      --wb-danger: #f53f3f;
      --wb-danger-bg: #ffece8;
      --wb-success: #00b42a;
      --wb-warning: #ff7d00;
      --wb-skeleton: #f2f3f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Helvetica Neue", Arial, sans-serif;
      background: var(--wb-bg);
      color: var(--wb-text-1);
      font-size: 14px;
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }

    /* ===== 顶部导航栏 ===== */
    .wb-nav {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0 24px;
      height: 56px;
      background: #fff;
      border-bottom: 1px solid var(--wb-border-2);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
    }
    .wb-nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 600;
      color: var(--wb-text-1);
      white-space: nowrap;
    }
    .wb-nav-logo { font-size: 22px; line-height: 1; }
    .wb-nav-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      list-style: none;
      margin: 0;
      padding: 0;
      flex-wrap: wrap;
    }
    .wb-nav-tabs a {
      display: inline-block;
      padding: 8px 16px;
      font-size: 14px;
      color: var(--wb-text-2);
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .wb-nav-tabs a:hover { background: #f2f3f5; color: var(--wb-text-1); }
    .wb-nav-tabs a.wb-nav-active {
      background: var(--wb-primary-bg);
      color: var(--wb-primary);
      font-weight: 600;
    }

    /* ===== 页面容器 ===== */
    .wb-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px;
    }
    .wb-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .wb-page-title { font-size: 22px; font-weight: 600; margin: 0 0 6px 0; }
    .wb-page-desc { color: var(--wb-text-3); font-size: 13px; margin: 0; }
    .wb-header-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .wb-refresh-tag {
      font-size: 12px;
      color: var(--wb-primary);
      background: var(--wb-primary-bg);
      padding: 3px 10px;
      border-radius: 10px;
    }
    .wb-last-updated {
      font-size: 12px;
      color: var(--wb-text-3);
      font-variant-numeric: tabular-nums;
    }

    /* ===== 错误横幅 ===== */
    .wb-error-banner {
      background: var(--wb-danger-bg);
      color: var(--wb-danger);
      padding: 10px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
      border: 1px solid #fdcdc5;
    }

    /* ===== 卡片网格（每行 2~3 张，响应式自适应） ===== */
    .wb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    /* ===== 团队卡片 ===== */
    .wb-card {
      display: flex;
      flex-direction: column;
      background: var(--wb-card-bg);
      border: 1px solid var(--wb-border);
      border-radius: 10px;
      padding: 18px 20px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      transition: box-shadow 0.18s, border-color 0.18s, transform 0.18s;
      cursor: pointer;
      min-height: 200px;
    }
    .wb-card:hover {
      box-shadow: 0 6px 18px rgba(51, 112, 255, 0.12);
      border-color: #c5dbff;
      transform: translateY(-2px);
    }
    .wb-card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .wb-card-avatar {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--wb-primary-bg);
      color: var(--wb-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .wb-card-title-block { flex: 1; min-width: 0; }
    .wb-card-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--wb-text-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wb-card-key {
      font-size: 12px;
      color: var(--wb-text-3);
      font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      margin-top: 2px;
    }
    .wb-card-arrow {
      color: var(--wb-text-3);
      font-size: 18px;
      flex-shrink: 0;
      transition: color 0.18s, transform 0.18s;
    }
    .wb-card:hover .wb-card-arrow {
      color: var(--wb-primary);
      transform: translateX(3px);
    }
    .wb-card-lead {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--wb-text-2);
      margin-bottom: 8px;
    }
    .wb-card-lead .wb-lead-icon { color: var(--wb-primary); flex-shrink: 0; }
    .wb-card-mission {
      font-size: 13px;
      color: var(--wb-text-3);
      line-height: 1.6;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 42px;
    }

    /* ===== 指标行 ===== */
    .wb-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .wb-stat {
      background: #f7f8fa;
      border-radius: 8px;
      padding: 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border: 1px solid transparent;
    }
    .wb-stat-top {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--wb-text-3);
    }
    .wb-stat-top svg { flex-shrink: 0; }
    .wb-stat-num {
      font-size: 22px;
      font-weight: 700;
      color: var(--wb-text-1);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .wb-stat-label {
      font-size: 12px;
      color: var(--wb-text-3);
    }
    /* 待审批红色高亮 */
    .wb-stat.wb-stat-danger {
      background: var(--wb-danger-bg);
      border-color: #fdcdc5;
    }
    .wb-stat.wb-stat-danger .wb-stat-top { color: var(--wb-danger); }
    .wb-stat.wb-stat-danger .wb-stat-num { color: var(--wb-danger); }
    .wb-stat.wb-stat-danger .wb-stat-label { color: var(--wb-danger); }

    /* ===== 卡片底部 ===== */
    .wb-card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--wb-border);
    }
    .wb-card-time {
      font-size: 12px;
      color: var(--wb-text-3);
      font-variant-numeric: tabular-nums;
    }
    .wb-card-enter {
      font-size: 13px;
      color: var(--wb-primary);
      font-weight: 600;
      white-space: nowrap;
    }

    /* ===== 骨架屏 ===== */
    .wb-skel-card {
      background: var(--wb-card-bg);
      border: 1px solid var(--wb-border);
      border-radius: 10px;
      padding: 18px 20px;
      min-height: 200px;
    }
    .wb-skel {
      display: block;
      background: var(--wb-skeleton);
      border-radius: 4px;
      animation: wb-pulse 1.2s ease-in-out infinite;
    }
    @keyframes wb-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .wb-skel-line { height: 14px; margin-bottom: 10px; }
    .wb-skel-title { height: 18px; width: 60%; margin-bottom: 6px; }
    .wb-skel-sub { height: 12px; width: 40%; margin-bottom: 16px; }
    .wb-skel-block { height: 48px; margin-bottom: 10px; }

    /* ===== 空状态 ===== */
    .wb-empty {
      grid-column: 1 / -1;
      background: var(--wb-card-bg);
      border: 1px dashed var(--wb-border-2);
      border-radius: 10px;
      padding: 60px 20px;
      text-align: center;
      color: var(--wb-text-3);
    }
    .wb-empty-icon { font-size: 40px; margin-bottom: 12px; }
    .wb-empty-text { font-size: 15px; }

    /* ===== 响应式：手机端 ===== */
    @media (max-width: 640px) {
      .wb-nav {
        height: auto;
        padding: 12px 16px;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .wb-nav-tabs { width: 100%; overflow-x: auto; }
      .wb-container { padding: 16px; }
      .wb-grid { grid-template-columns: 1fr; }
      .wb-header { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <!-- 顶部导航栏：WorkBuddy 标题 + 4 个 tab -->
  <nav class="wb-nav">
    <div class="wb-nav-brand">
      <span class="wb-nav-logo">🤖</span>
      <span>WorkBuddy</span>
    </div>
    <ul class="wb-nav-tabs">
      <li><a href="dashboard.html" class="wb-nav-active">看板</a></li>
      <li><a href="workspace.html">工作区</a></li>
      <li><a href="config.html">配置</a></li>
      <li><a href="index.html">日志</a></li>
    </ul>
  </nav>

  <div class="wb-container">
    <!-- 页头 -->
    <div class="wb-header">
      <div>
        <h1 class="wb-page-title">专家团看板</h1>
        <p class="wb-page-desc">全部 active 专家团的实时状态概览，点击卡片进入团队工作区。</p>
      </div>
      <div class="wb-header-meta">
        <span class="wb-refresh-tag">每 30s 自动刷新</span>
        <span id="last-updated" class="wb-last-updated">—</span>
      </div>
    </div>

    <!-- 错误横幅 -->
    <div id="error-banner" class="wb-error-banner" style="display:none;"></div>

    <!-- 团队卡片网格（骨架屏 / 卡片 / 空状态 由 JS 注入） -->
    <div id="team-grid" class="wb-grid"></div>
  </div>

  <script>
    'use strict';
    (function () {
      /** 自动刷新间隔（毫秒） */
      var REFRESH_INTERVAL = 30000; // 30s
      /** 骨架屏占位卡片数 */
      var SKELETON_COUNT = 6;
      var timerId = null;
      var firstLoad = true;

      /**
       * 从 window.location 推断同源 API 基础路径。
       * 约定：页面位于 <appRoot>/pages/*.html，云函数位于 <appRoot>/api/<name>。
       * 兼容子路径部署；无法识别时回退到根部署的 /api。
       */
      function inferApiBase() {
        var m = window.location.pathname.match(/^(.*\/)pages\/[^/]*$/);
        if (m && m[1]) return m[1] + 'api';
        return '/api';
      }
      var API_BASE = inferApiBase();

      /* ---------- SVG 图标（内联，避免外部依赖） ---------- */
      var ICON_MISSION =
        '<svg width="16" height="16" viewBox="0 0 16 16" fill="none">' +
        '<rect x="4" y="2" width="8" height="12" rx="1.5" stroke="currentColor" stroke-width="1.4"/>' +
        '<path d="M6 6h4M6 9h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>' +
        '</svg>';
      var ICON_WORKITEM =
        '<svg width="16" height="16" viewBox="0 0 16 16" fill="none">' +
        '<path d="M8 1.5l1.8 3.6 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4L2.2 5.7l4-.6L8 1.5z" ' +
        'stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>' +
        '</svg>';
      var ICON_APPROVAL =
        '<svg width="16" height="16" viewBox="0 0 16 16" fill="none">' +
        '<path d="M8 1.5a2.5 2.5 0 0 1 2.5 2.5v.5l2.5 1v1.5H3V5.5l2.5-1V4A2.5 2.5 0 0 1 8 1.5z" ' +
        'stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>' +
        '<path d="M6 13.5h4M7 15h2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>' +
        '</svg>';
      var ICON_LEAD =
        '<svg width="14" height="14" viewBox="0 0 16 16" fill="none">' +
        '<circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.4"/>' +
        '<path d="M3 13.5a5 5 0 0 1 10 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>' +
        '</svg>';

      /* ---------- 工具函数 ---------- */
      function $(id) { return document.getElementById(id); }

      /** HTML 转义，防止团队名 / 使命含特殊字符破坏 DOM */
      function escapeHtml(s) {
        s = s == null ? '' : String(s);
        return s
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      /** URL 参数编码 */
      function encodeParam(s) {
        return encodeURIComponent(s == null ? '' : String(s));
      }

      /**
       * 格式化时间，兼容 'YYYY-MM-DD HH:MM:SS' / ISO 字符串 / 毫秒时间戳。
       * @param {string|number|null} s
       * @returns {string} 'YYYY-MM-DD HH:MM'；无值返回 '—'
       */
      function fmtTime(s) {
        if (s == null || s === '') return '—';
        var d;
        if (typeof s === 'number') {
          d = new Date(s); // 毫秒时间戳（飞书 base datetime 字段）
        } else {
          d = new Date(String(s).replace(' ', 'T'));
        }
        if (isNaN(d.getTime())) return String(s);
        var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
          ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
      }

      /** 显示 / 隐藏错误横幅 */
      function showError(msg) {
        var b = $('error-banner');
        b.textContent = '加载看板数据失败：' + msg;
        b.style.display = 'block';
      }
      function clearError() { $('error-banner').style.display = 'none'; }

      /** 更新"最后更新时间" */
      function markUpdated() {
        var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
        var d = new Date();
        $('last-updated').textContent = '最后更新：' +
          pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      }

      /* ---------- 渲染：骨架屏 ---------- */
      function renderSkeleton() {
        var grid = $('team-grid');
        var html = '';
        for (var i = 0; i < SKELETON_COUNT; i++) {
          html +=
            '<div class="wb-skel-card">' +
              '<span class="wb-skel wb-skel-title"></span>' +
              '<span class="wb-skel wb-skel-sub"></span>' +
              '<span class="wb-skel wb-skel-line" style="width:90%"></span>' +
              '<span class="wb-skel wb-skel-line" style="width:70%"></span>' +
              '<span class="wb-skel wb-skel-block" style="width:100%"></span>' +
            '</div>';
        }
        grid.innerHTML = html;
      }

      /* ---------- 渲染：空状态 ---------- */
      function renderEmpty() {
        $('team-grid').innerHTML =
          '<div class="wb-empty">' +
            '<div class="wb-empty-icon">📭</div>' +
            '<div class="wb-empty-text">暂无团队</div>' +
          '</div>';
      }

      /* ---------- 渲染：团队卡片 ---------- */
      function renderTeams(teams) {
        var grid = $('team-grid');
        if (!teams || teams.length === 0) {
          renderEmpty();
          return;
        }
        var html = '';
        for (var i = 0; i < teams.length; i++) {
          var t = teams[i] || {};
          var hasPending = (t.pending_approvals || 0) > 0;
          var dangerCls = hasPending ? ' wb-stat-danger' : '';
          var leadName = t.lead_name || '未指定';
          // 整张卡片为 <a>，点击跳转工作区页面并带 team_key 参数
          html +=
            '<a class="wb-card" href="workspace.html?team_key=' +
              encodeParam(t.team_key) + '">' +
              '<div class="wb-card-head">' +
                '<span class="wb-card-avatar">👥</span>' +
                '<div class="wb-card-title-block">' +
                  '<div class="wb-card-name">' + escapeHtml(t.name) + '</div>' +
                  '<div class="wb-card-key">' + escapeHtml(t.team_key) + '</div>' +
                '</div>' +
                '<span class="wb-card-arrow">→</span>' +
              '</div>' +
              '<div class="wb-card-lead">' +
                '<span class="wb-lead-icon">' + ICON_LEAD + '</span>' +
                '<span>主理人：' + escapeHtml(leadName) + '</span>' +
              '</div>' +
              '<div class="wb-card-mission">' + escapeHtml(t.mission || '—') + '</div>' +
              '<div class="wb-stats">' +
                '<div class="wb-stat">' +
                  '<div class="wb-stat-top">' + ICON_MISSION +
                    '<span class="wb-stat-label">进行中任务</span></div>' +
                  '<span class="wb-stat-num">' + (t.active_missions || 0) + '</span>' +
                '</div>' +
                '<div class="wb-stat">' +
                  '<div class="wb-stat-top">' + ICON_WORKITEM +
                    '<span class="wb-stat-label">活跃工作项</span></div>' +
                  '<span class="wb-stat-num">' + (t.active_work_items || 0) + '</span>' +
                '</div>' +
                '<div class="wb-stat' + dangerCls + '">' +
                  '<div class="wb-stat-top">' + ICON_APPROVAL +
                    '<span class="wb-stat-label">待审批</span></div>' +
                  '<span class="wb-stat-num">' + (t.pending_approvals || 0) + '</span>' +
                '</div>' +
              '</div>' +
              '<div class="wb-card-foot">' +
                '<span class="wb-card-time">最近活动：' +
                  escapeHtml(fmtTime(t.last_activity)) + '</span>' +
                '<span class="wb-card-enter">进入工作区 →</span>' +
              '</div>' +
            '</a>';
        }
        grid.innerHTML = html;
      }

      /* ---------- 数据加载 ---------- */
      function loadDashboard() {
        // 首次加载显示骨架屏；后续刷新静默更新，避免卡片闪烁
        if (firstLoad) {
          renderSkeleton();
          firstLoad = false;
        }
        return fetch(API_BASE + '/get_dashboard', {
          method: 'GET',
          headers: { Accept: 'application/json' }
        })
          .then(function (resp) {
            // 容错：404 时给出可读提示（API_BASE 配置或云函数未部署）
            if (resp.status === 404) {
              throw new Error('云函数 get_dashboard 未找到（HTTP 404），请检查部署状态');
            }
            return resp.json().then(
              function (json) {
                if (!resp.ok || !json || json.ok === false) {
                  throw new Error(
                    (json && json.error) ? json.error : ('HTTP ' + resp.status)
                  );
                }
                return json.teams;
              },
              function () {
                throw new Error('云函数返回非 JSON（HTTP ' + resp.status + '）');
              }
            );
          })
          .then(function (teams) {
            clearError();
            renderTeams(teams);
            markUpdated();
          })
          .catch(function (err) {
            showError(err && err.message ? err.message : String(err));
            // 出错且当前网格为空时，展示空状态占位，避免白屏
            if (!$('team-grid').innerHTML.trim()) {
              renderEmpty();
            }
          });
      }

      /* ---------- 自动刷新（页面隐藏时暂停） ---------- */
      function startTimer() {
        if (timerId) return;
        timerId = setInterval(loadDashboard, REFRESH_INTERVAL);
      }
      function stopTimer() {
        if (timerId) { clearInterval(timerId); timerId = null; }
      }
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          stopTimer();
        } else {
          loadDashboard();
          startTimer();
        }
      });

      // 启动：首次加载 + 定时刷新
      loadDashboard();
      startTimer();
    })();
  </script>
</body>
</html>
