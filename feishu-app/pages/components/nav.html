<!--
  WorkBuddy 共用顶部导航组件。

  使用方式（其他页面）：
    1. 页面里放一个占位：<div id="nav" data-active="dashboard"></div>
       data-active 取值：dashboard / archives / config / control
    2. 页面引入 <script src="js/api.js"></script>（该文件同时承载 API 封装与导航加载器）
    3. 页面调用 WorkBuddyNav.mount('nav') 即可自动 fetch 本文件并注入。

  本文件只包含一个 <template>，内含 <style> 与 <nav> 结构。
  fetch 后由 js/api.js 中的 WorkBuddyNav.mount 通过 DOMParser 解析、
  clone template.content 注入页面，<style> 随 content 一起进入文档生效。
  注意：<template> 内的 <script> 注入后不会自动执行，故加载器不放在这里。
-->
<template id="wb-nav-template">
  <style>
    .wb-nav {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0 24px;
      height: 56px;
      background: #ffffff;
      border-bottom: 1px solid #e5e6eb;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      position: sticky;
      top: 0;
      z-index: 100;
      box-sizing: border-box;
      flex-wrap: wrap;
    }
    .wb-nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 600;
      color: #1d2129;
      white-space: nowrap;
    }
    .wb-nav-logo {
      font-size: 22px;
      line-height: 1;
    }
    .wb-nav-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      list-style: none;
      margin: 0;
      padding: 0;
      flex-wrap: wrap;
    }
    .wb-nav-tabs a {
      display: inline-block;
      padding: 8px 16px;
      font-size: 14px;
      color: #4e5969;
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .wb-nav-tabs a:hover {
      background: #f2f3f5;
      color: #1d2129;
    }
    .wb-nav-tabs a.wb-nav-active {
      background: #e8f0ff;
      color: #3370ff;
      font-weight: 600;
    }
    @media (max-width: 600px) {
      .wb-nav {
        height: auto;
        padding: 12px 16px;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .wb-nav-tabs {
        width: 100%;
        overflow-x: auto;
      }
    }
  </style>
  <nav class="wb-nav">
    <div class="wb-nav-brand">
      <span class="wb-nav-logo">🤖</span>
      <span class="wb-nav-title">WorkBuddy</span>
    </div>
    <ul class="wb-nav-tabs">
      <li><a href="index.html" data-tab="dashboard">仪表盘</a></li>
      <li><a href="archives.html" data-tab="archives">归档邮件</a></li>
      <li><a href="config.html" data-tab="config">配置</a></li>
      <li><a href="control.html" data-tab="control">控制</a></li>
    </ul>
  </nav>
</template>
