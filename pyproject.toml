[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workbuddy-commercial-ga"
version = "1.0.0"
description = "WorkBuddy expert-team operating system commercial GA readiness platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.120",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "cryptography>=42",
  "PyJWT>=2.8",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2",
  "jsonschema>=4.20",
  "boto3>=1.34"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
gcs = ["google-cloud-storage>=2.10"]

[project.scripts]
workbuddy-seed = "workbuddy.services.seed:main"
workbuddy-outbox = "workbuddy.services.outbox:main"
workbuddy-worker = "workbuddy.services.worker:main"
workbuddy-commercial-bootstrap = "workbuddy.services.seed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workbuddy = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
