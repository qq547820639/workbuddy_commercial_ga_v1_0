<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WorkBuddy Expert Team OS</title>
<style>
:root{--bg:#0e1118;--panel:#171b25;--panel2:#202636;--line:#2d3548;--text:#edf0f7;--muted:#929bad;--accent:#b99cff;--green:#68d39b;--amber:#f0bd62;--red:#ff8181;--blue:#70a9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif}button,input,select,textarea{font:inherit}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#131720;border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:800;color:var(--accent);padding:4px 10px 20px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.12em}.nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--muted);padding:11px 12px;border-radius:8px;margin:3px 0;cursor:pointer}.nav button:hover,.nav button.on{background:#242a3b;color:var(--text)}.main{min-width:0}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:rgba(14,17,24,.92);position:sticky;top:0;z-index:4;backdrop-filter:blur(10px)}.top h1{font-size:17px;margin:0}.content{padding:24px 26px;max-width:1500px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 13px;border-radius:8px;cursor:pointer}.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);color:#12131a;font-weight:700}.btn.danger{color:var(--red)}.btn.sm{padding:5px 9px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}.card.click{cursor:pointer}.card.click:hover{border-color:var(--accent);transform:translateY(-1px)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.kpi{background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:12px}.kpi strong{font-size:27px;display:block}.muted{color:var(--muted)}.tag{font-size:11px;border-radius:99px;padding:3px 8px;background:#292f40;color:var(--muted);display:inline-block}.tag.green{background:#143426;color:var(--green)}.tag.red{background:#3a2025;color:var(--red)}.tag.amber{background:#3c301c;color:var(--amber)}.tag.blue{background:#1c2d48;color:var(--blue)}.tag.purple{background:#2d2545;color:var(--accent)}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:10px}.title{font-size:16px;font-weight:700}.section{font-size:17px;margin:25px 0 12px}.table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.table th,.table td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}.table th{color:var(--muted);font-size:12px;background:#141923}.table tr:last-child td{border:0}.subject{font-weight:650}.progress{height:7px;background:#2a3040;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--accent)}pre{white-space:pre-wrap;word-break:break-word;background:#10131a;border:1px solid var(--line);padding:12px;border-radius:8px;color:#cbd2df}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;max-width:900px;width:90%;padding:0}dialog::backdrop{background:#000a}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:20px;max-height:75vh;overflow:auto}.close{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer}.notice{padding:12px;border-radius:8px;background:#1d2637;border-left:3px solid var(--blue);margin-bottom:14px}.warning{border-left-color:var(--amber);background:#31291b}.error{border-left-color:var(--red);background:#362126}.ok{border-left-color:var(--green);background:#173024}.empty{padding:35px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:12px}.workitem{border:1px solid var(--line);background:#141923;border-radius:10px;padding:14px}.workitem .actions{margin-top:10px;display:flex;gap:7px;flex-wrap:wrap}.json{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.form{display:grid;gap:10px}.form input,.form textarea,.form select{width:100%;background:#10141c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pill{display:inline-flex;align-items:center;gap:5px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.top{position:static}.kpis{grid-template-columns:1fr 1fr}.content{padding:16px}.two{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app"><aside class="side"><div class="brand">WorkBuddy<small>EXPERT TEAM OS · COMMERCIAL GA</small></div><nav class="nav" id="nav"></nav><div style="position:absolute;bottom:16px;padding:10px;color:var(--muted);font-size:12px"><span class="pill"><span class="dot"></span> Commercial GA v1.0</span><br>真实发送默认关闭，需白名单与审批</div></aside><main class="main"><header class="top"><h1 id="pageTitle">公司运行看板</h1><div class="row"><span class="tag purple">真人老板</span><button class="btn sm" onclick="setToken()">访问令牌</button><button class="btn sm" onclick="reload()">刷新</button></div></header><section class="content" id="view"></section></main></div><dialog id="modal"><div class="modal-head"><strong id="modalTitle"></strong><button class="close" onclick="modal.close()">×</button></div><div class="modal-body" id="modalBody"></div></dialog>
<script>
const TENANT='00000000-0000-0000-0000-000000000001';let page='dashboard';let cache={};let refreshTimer=null;let workspaceTeamKey=null;let workspaceMissionFilter='active';let workspaceExpandedMission=null;const pages=[['dashboard','公司看板'],['inbox','邮箱与调度'],['missions','主理人任务'],['teams','专家团'],['workspace','专家团工作区'],['skills','Skill 库'],['approvals','老板审批'],['pilot','Beta 运营'],['production','生产试点'],['commercial','商用与 GA'],['governance','治理与数据'],['audit','审计与事件']];
const $=s=>document.querySelector(s);const modal=$('#modal');
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}
async function api(path,opts={}){const token=sessionStorage.getItem('workbuddy_token');opts.headers={...(opts.headers||{}),'X-Tenant-ID':TENANT,'X-Actor-ID':'owner','X-Roles':'owner product_owner security_owner operations_owner privacy_owner platform_owner it_admin ai_platform_owner business_owner finance_owner legal_owner support_owner'};if(token)opts.headers['Authorization']='Bearer '+token;if(opts.body && !(opts.body instanceof FormData)){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.body)}const r=await fetch(path,opts);let data;try{data=await r.json()}catch{data={detail:await r.text()}}if(!r.ok)throw new Error(data.detail||r.statusText);return data}
function tag(status){let c='blue';if(/COMPLETED|ACCEPTED|APPROVED|SUCCEEDED|CLOSED|CONFIRMED|published/i.test(status))c='green';if(/FAILED|REJECTED|BLOCKED|CANCELLED|INVALID/i.test(status))c='red';if(/APPROVAL|WAIT|PENDING|REVIEW|UNKNOWN|PLANNING/i.test(status))c='amber';return `<span class="tag ${c}">${esc(status)}</span>`}
function setPage(p){if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null}page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));$('#pageTitle').textContent=pages.find(x=>x[0]===p)[1];render()}
$('#nav').innerHTML=pages.map(([p,n])=>`<button data-p="${p}" onclick="setPage('${p}')">${n}</button>`).join('');
function notice(msg,type=''){return `<div class="notice ${type}">${msg}</div>`}
async function reload(){cache={};await render()}
async function render(){const v=$('#view');v.innerHTML='<div class="empty">正在加载…</div>';try{if(page==='dashboard')await dashboard(v);if(page==='inbox')await inbox(v);if(page==='missions')await missions(v);if(page==='teams')await teams(v);if(page==='workspace')await workspace(v);if(page==='skills')await skills(v);if(page==='approvals')await approvals(v);if(page==='pilot')await pilot(v);if(page==='production')await production(v);if(page==='commercial')await commercial(v);if(page==='governance')await governance(v);if(page==='audit')await audit(v)}catch(e){v.innerHTML=notice(esc(e.message),'error')}}
async function dashboard(v){
  const d=await api('/v1/dashboard');
  const cards=await Promise.all(d.teams.map(t=>api(`/v1/teams/${t.team_key}/dashboard`).catch(()=>null)));
  const enriched=d.teams.map((t,i)=>Object.assign({id:t.id,team_key:t.team_key},cards[i]||{})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  window._dash={d,enriched};
  dashboardRender(v);
  if(refreshTimer)clearInterval(refreshTimer);
  refreshTimer=setInterval(()=>{if(page!=='dashboard')return;dashboardPoll()},30000);
}
async function dashboardPoll(){
  try{
    const d=await api('/v1/dashboard');
    const cards=await Promise.all(d.teams.map(t=>api(`/v1/teams/${t.team_key}/dashboard`).catch(()=>null)));
    const enriched=d.teams.map((t,i)=>Object.assign({id:t.id,team_key:t.team_key},cards[i]||{})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    window._dash={d,enriched};
    if(page==='dashboard')dashboardRender($('#view'));
  }catch(e){}
}
function dashboardRender(v){
  const d=(window._dash&&window._dash.d)||{inbox_pending:0,active_runs:0,pending_approvals:0,outbox_pending:0};
  const enriched=(window._dash&&window._dash.enriched)||[];
  v.innerHTML=`<div class="toolbar"><button class="btn primary" onclick="bootstrap()">载入演示邮件</button><button class="btn" onclick="publishOutbox()">发布 Outbox</button><button class="btn danger" onclick="resetDemo()">重置运行数据</button><span class="muted" style="margin-left:auto">最后更新：${esc(new Date().toLocaleTimeString())}</span></div><div class="kpis"><div class="kpi"><strong>${d.inbox_pending}</strong><span class="muted">待调度邮件</span></div><div class="kpi"><strong>${d.active_runs}</strong><span class="muted">运行中的 AgentRun</span></div><div class="kpi"><strong>${d.pending_approvals}</strong><span class="muted">等待老板审批</span></div><div class="kpi"><strong>${d.outbox_pending}</strong><span class="muted">待发布领域事件</span></div></div><h2 class="section">专家团 AI 员工看板</h2><div class="grid">${enriched.length?enriched.map(teamCardHTML).join(''):'<div class="empty">暂无专家团</div>'}</div>`;
}
function teamCardHTML(t){
  const mission=esc((t.mission||'').slice(0,70))||'<span class="muted">未设定使命</span>';
  const pending=t.pending_approvals_count?`<span class="tag amber">${t.pending_approvals_count} 待审批</span>`:'<span class="tag green">无待审批</span>';
  const inProg=t.in_progress_missions_count!=null?t.in_progress_missions_count:0;
  const actWi=t.active_workitems_count!=null?t.active_workitems_count:0;
  const upd=(t.last_updated_at||'').slice(11,16)||'—';
  return `<article class="card click" onclick="showTeamWorkspace('${esc(t.team_key)}')"><div class="row between"><div class="title">${esc(t.name||t.team_key)}</div>${t.active===false?'<span class="tag">已停用</span>':'<span class="tag green">运行中</span>'}</div><div class="muted" style="font-size:11px">team_key: ${esc(t.team_key)}</div><p class="muted">主理人：${esc(t.lead_agent||'未配置')}</p><p style="margin:8px 0;min-height:22px">${mission}</p><div class="two"><div><strong>${inProg}</strong><div class="muted">进行中 Mission</div></div><div><strong>${actWi}</strong><div class="muted">活跃 WorkItem</div></div></div><div class="row between" style="margin-top:10px"><span>${pending}</span><span class="muted" style="font-size:11px">更新：${esc(upd)}</span></div></article>`;
}
async function bootstrap(){await api('/v1/demo/bootstrap',{method:'POST'});setPage('inbox')}
async function publishOutbox(){const d=await api('/v1/outbox/publish',{method:'POST'});alert(`已发布 ${d.published}，失败 ${d.failed}`);reload()}
async function resetDemo(){if(!confirm('清除运行数据，但保留专家团、工作流和 Skill？'))return;await api('/v1/demo/reset',{method:'POST'});setPage('dashboard')}
async function inbox(v){const rows=await api('/v1/inbox');v.innerHTML=`<div class="toolbar"><button class="btn primary" onclick="bootstrap()">载入演示邮件</button><button class="btn" onclick="showGmail()">连接 Gmail</button></div>${rows.length?`<table class="table"><thead><tr><th>邮件</th><th>状态</th><th>调度建议</th><th></th></tr></thead><tbody>${rows.map(m=>`<tr><td><div class="subject">${esc(m.subject)}</div><div class="muted">${esc(m.sender)}</div><div class="muted">${esc(m.body_text).slice(0,100)}</div></td><td>${tag(m.processing_status)}</td><td>${m.dispatch?`${tag(m.dispatch.risk_level)} 置信 ${m.dispatch.confidence}%<br><span class="muted">${esc((m.dispatch.reasons||[]).join('；'))}</span>`:'尚未识别'}</td><td>${!m.dispatch?`<button class="btn sm" onclick="propose('${m.id}')">识别并路由</button>`:m.dispatch.status==='PROPOSED'?`<button class="btn primary sm" onclick="confirmRoute('${m.dispatch.id}')">确认转交</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无邮件。载入演示邮件或配置 Gmail。</div>'}`}
async function propose(id){await api(`/v1/inbox/${id}/dispatch`,{method:'POST'});reload()}
async function confirmRoute(id){const teams=await api('/v1/teams');const options=teams.map(t=>`<option value="${t.team_key}">${esc(t.name)}</option>`).join('');showModal('确认调度',`<form class="form" onsubmit="doConfirmRoute(event,'${id}')"><label>主责专家团<select id="routeTeam">${options}</select></label><button class="btn primary">确认并进入主理人队列</button></form>`)}
async function doConfirmRoute(e,id){e.preventDefault();await api(`/v1/dispatch/${id}/confirm`,{method:'POST',body:{team_key:$('#routeTeam').value}});modal.close();setPage('missions')}
async function showGmail(enableSend=false){const d=await api(`/v1/connectors/gmail/start?enable_send=${enableSend}`);if(d.configured)location.href=d.authorization_url;else showModal('Gmail 连接器',notice('连接器代码已启用，但当前环境没有 Gmail OAuth 客户端凭据。请配置环境变量后重启。','warning')+`<pre>${esc((d.required_env||[]).join('\n'))}</pre>`)}
async function showGraph(enableSend=false){const d=await api(`/v1/connectors/graph/start?enable_send=${enableSend}`);if(d.configured)location.href=d.authorization_url;else showModal('Microsoft Graph 连接器',notice('连接器代码已启用，但当前环境没有 Entra 应用凭据。','warning')+`<pre>${esc((d.required_env||[]).join('\n'))}</pre>`)}
async function missions(v){const rows=await api('/v1/missions');v.innerHTML=rows.length?`<table class="table"><thead><tr><th>任务</th><th>状态</th><th>风险</th><th>版本</th></tr></thead><tbody>${rows.map(m=>`<tr class="click" onclick="openMission('${m.id}')"><td><div class="subject">${esc(m.title)}</div><span class="muted">${esc(m.objective).slice(0,100)}</span></td><td>${tag(m.status)}</td><td>${tag(m.risk_level)}</td><td>v${m.version} / plan ${m.plan_version}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">尚无任务。先在邮箱与调度中确认一封邮件。</div>'}
async function openMission(id){const d=await api(`/v1/missions/${id}`),m=d.mission;window.currentMissionDetail=d;let actions='';if(m.status==='ROUTED')actions=`<button class="btn primary" onclick="missionAction('${id}','accept',${m.version})">主理人接单</button>`;if(m.status==='LEAD_TRIAGE'||m.status==='PLANNING')actions=`<button class="btn primary" onclick="missionAction('${id}','plan',${m.version})">生成任务清单</button>`;if(m.status==='PLANNING'&&d.work_items.length)actions+=` <button class="btn" onclick="missionAction('${id}','approve-plan',${m.version})">老板批准计划</button>`;if(m.status==='READY')actions=`<button class="btn primary" onclick="missionAction('${id}','start',${m.version})">启动执行</button>`;if(m.status==='EXECUTING'&&d.work_items.length&&d.work_items.every(i=>i.status==='ACCEPTED'))actions=`<button class="btn primary" onclick="missionAction('${id}','lead-review',${m.version})">主理人整合并提交</button>`;
showModal(m.title,`<div class="row between"><div>${tag(m.status)} ${tag(m.risk_level)}</div><div>Mission v${m.version} · Plan v${m.plan_version}</div></div><p>${esc(m.objective)}</p><div class="toolbar">${actions}${m.status==='PLANNING'?` <button class="btn" onclick="addDependencyUI('${id}')">编辑依赖</button>`:''}</div><h3>任务清单</h3><div class="stack">${d.work_items.length?d.work_items.map(i=>workItemHTML(i,d.agent_runs,m.status)).join(''):'<div class="empty">主理人尚未创建任务清单</div>'}</div><h3>成果</h3>${d.artifacts.length?d.artifacts.map(a=>`<div class="workitem"><strong>${esc(a.title)}</strong><pre class="json">${esc(JSON.stringify(a.content,null,2))}</pre></div>`).join(''):'<p class="muted">暂无成果</p>'}<h3>审批</h3>${d.approvals.length?d.approvals.map(a=>`<div class="workitem">${tag(a.status)} <strong>${esc(a.decision_question)}</strong><p>${esc(a.recommendation)}</p></div>`).join(''):'<p class="muted">暂无审批</p>'}`)}
function workItemHTML(i,runs,missionStatus){const run=runs.find(r=>r.work_item_id===i.id);let acts=missionStatus==='PLANNING'?`<button class="btn sm" onclick="editItem('${i.id}',${i.version})">编辑任务</button>`:'';if(['READY','ASSIGNED','REVISION_REQUIRED'].includes(i.status))acts=`<button class="btn sm" onclick="startItem('${i.id}')">启动 AgentRun</button>`;if(i.status==='RUNNING'&&run)acts=`<button class="btn primary sm" onclick="completeRun('${run.id}')">执行 AgentRun</button>`;if(i.status==='SUBMITTED')acts=`<button class="btn primary sm" onclick="reviewItem('${i.id}','accept')">验收</button><button class="btn sm" onclick="reviewItem('${i.id}','revise')">返工</button>`;return `<div class="workitem"><div class="row between"><strong>${esc(i.title)}</strong>${tag(i.status)}</div><p class="muted">${esc(i.objective)}</p><div class="muted">SkillRelease: ${esc(i.skill_release_id||'未绑定')} · AgentProfile: ${esc(i.assigned_agent_profile_id||'未分配')}</div><div class="actions">${acts}</div></div>`}
async function missionAction(id,act,version){let body={expected_version:version,reason:'通过产品界面执行'};if(act==='plan')body.workflow_key=null;const path=act==='lead-review'?`/v1/missions/${id}/lead-review`:`/v1/missions/${id}/${act}`;await api(path,{method:'POST',body});await openMission(id);reload()}
async function startItem(id){await api(`/v1/work-items/${id}/start`,{method:'POST'});const missions=await api('/v1/missions');const m=missions.find(x=>x.status==='EXECUTING');if(m)openMission(m.id)}
async function completeRun(id){const run=await api(`/v1/agent-runs/${id}/execute`,{method:'POST',body:{force_provider:'configured'}});alert(`AgentRun 已完成：${run.status}`);modal.close();setPage('missions')}
async function reviewItem(id,d){await api(`/v1/work-items/${id}/review`,{method:'POST',body:{decision:d,reason:d==='accept'?'符合验收标准':'需要补充证据'}});modal.close();setPage('missions')}
async function editItem(id,version){const item=window.currentMissionDetail.work_items.find(x=>x.id===id);const objective=prompt('修改任务目标',item.objective);if(!objective)return;await api(`/v1/work-items/${id}`,{method:'PATCH',body:{expected_version:version,objective,acceptance_criteria:item.acceptance_criteria}});await openMission(item.mission_id)}
async function addDependencyUI(missionId){const d=window.currentMissionDetail;const opts=d.work_items.map(i=>`<option value="${i.id}">${esc(i.title)}</option>`).join('');showModal('编辑任务依赖',`<form class="form" onsubmit="addDependency(event,'${missionId}')"><label>工作项<select id="depTarget">${opts}</select></label><label>依赖于<select id="depSource">${opts}</select></label><button class="btn primary">添加依赖</button></form><h4>现有依赖</h4>${d.dependencies.map(x=>`<div class="row between"><span>${esc(x.work_item_id)} ← ${esc(x.depends_on_id)}</span><button class="btn sm danger" onclick="removeDependency('${x.id}','${missionId}')">删除</button></div>`).join('')||'<p class="muted">无</p>'}`)}
async function addDependency(e,missionId){e.preventDefault();await api(`/v1/missions/${missionId}/dependencies`,{method:'POST',body:{work_item_id:$('#depTarget').value,depends_on_id:$('#depSource').value}});await openMission(missionId)}
async function removeDependency(id,missionId){await api(`/v1/dependencies/${id}`,{method:'DELETE'});await openMission(missionId)}
async function teams(v){const rows=await api('/v1/teams');v.innerHTML=`<div class="grid">${rows.map(t=>`<article class="card click" onclick="openTeam('${t.id}')"><div class="title">${esc(t.name)}</div><p>${esc(t.constitution?.mission||'')}</p><div class="row">${tag(t.agents.length+' 名成员')}${tag(t.workflows.length+' 个工作流')}</div><p class="muted">主理人：${esc((t.agents.find(a=>a.is_lead)||{}).name||'未配置')}</p></article>`).join('')}</div>`}

async function skills(v){const rows=await api('/v1/skills');v.innerHTML=`<div class="toolbar"><label class="btn">上传声明式 Skill<input type="file" accept=".yaml,.yml,.json,.md,.txt" style="display:none" onchange="uploadSkill(this.files[0])"></label></div><table class="table"><thead><tr><th>Skill</th><th>版本</th><th>来源</th><th>状态</th><th>权限</th></tr></thead><tbody>${rows.map(x=>`<tr><td><strong>${esc(x.definition.name)}</strong><br><span class="muted">${esc(x.definition.skill_key)}</span></td><td>${esc(x.release.semantic_version)}</td><td>${x.release.uploaded_by_user?'用户':'平台/公司'}</td><td>${tag(x.release.status)} ${['draft','validating','testing','approved'].includes(x.release.status)?`<button class="btn sm" onclick="testSkill('${x.release.id}')">测试</button> <button class="btn sm" onclick="publishSkill('${x.release.id}')">发布</button>`:''}</td><td><span class="muted">${esc(JSON.stringify(x.release.config.permissions||{}))}</span></td></tr>`).join('')}</tbody></table>`}

async function publishSkill(id){await api(`/v1/skills/${id}/publish`,{method:'POST'});reload()}
async function approvals(v){const rows=await api('/v1/approvals');v.innerHTML=rows.length?`<div class="stack">${rows.map(a=>`<article class="card"><div class="row between"><strong>${esc(a.decision_question)}</strong>${tag(a.status)}</div><p>${esc(a.recommendation)}</p><pre class="json">${esc(JSON.stringify(a.exact_action,null,2))}</pre>${a.status==='PENDING'?`<button class="btn primary" onclick="decide('${a.id}','approve')">批准精确动作</button> <button class="btn" onclick="decide('${a.id}','changes_requested')">退回修改</button>`:''}${a.status==='APPROVED'?`<button class="btn primary" onclick="prepareOp('${a.id}')">准备受控外部操作</button>`:''}</article>`).join('')}</div>`:'<div class="empty">暂无待审批事项</div>'}

async function executeOp(id,u){const op=await api(`/v1/operations/${id}/execute`,{method:'POST',body:{simulate_unknown:u}});if(op.status==='UNKNOWN'){showModal('结果未知',notice('系统不会直接重试。必须先核验服务商结果。','error')+`<button class="btn primary" onclick="verifyOp('${id}','succeeded')">核验为成功</button> <button class="btn" onclick="verifyOp('${id}','failed')">核验为失败</button>`)}else{modal.close();setPage('dashboard')}}

async function pilot(v){const [r,dispatch,sync,quality,models]=await Promise.all([api('/v1/beta/readiness'),api('/v1/pilot/dispatch-metrics'),api('/v1/pilot/sync-runs?limit=30'),api('/v1/quality'),api('/v1/model/invocations?limit=30')]);const checks=Object.entries(r.checks||{});v.innerHTML=`${notice('受控 Beta 只在 Gate B/C/D 对应条件满足后开放更高权限。第三方应用注册、真实邮箱演练和生产安全评审必须由运营方完成。','warning')}<div class="kpis"><div class="kpi"><strong>${r.gate_b_ready?'✓':'—'}</strong><span class="muted">Gate B 邮箱影子</span></div><div class="kpi"><strong>${r.gate_c_ready?'✓':'—'}</strong><span class="muted">Gate C Agent 执行</span></div><div class="kpi"><strong>${r.gate_d_ready?'✓':'—'}</strong><span class="muted">Gate D 真实发送</span></div><div class="kpi"><strong>${models.length}</strong><span class="muted">模型调用记录</span></div></div><h2 class="section">Readiness 检查</h2><table class="table"><tbody>${checks.map(([k,val])=>`<tr><td>${esc(k)}</td><td>${tag(val?'PASS':'PENDING')}</td></tr>`).join('')}</tbody></table><h2 class="section">调度影子指标</h2><pre class="json">${esc(JSON.stringify(dispatch,null,2))}</pre><h2 class="section">成果质量</h2><pre class="json">${esc(JSON.stringify(quality,null,2))}</pre><h2 class="section">最近同步运行</h2>${sync.length?`<table class="table"><thead><tr><th>开始</th><th>Provider</th><th>状态</th><th>结果</th></tr></thead><tbody>${sync.map(x=>`<tr><td>${esc(x.started_at||x.created_at)}</td><td>${esc(x.provider)}</td><td>${tag(x.status)}</td><td class="json">${esc(JSON.stringify(x.result||{})).slice(0,160)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">尚无真实邮箱同步运行</div>'}<h2 class="section">最近模型调用</h2>${models.length?`<table class="table"><thead><tr><th>任务</th><th>Provider / Model</th><th>状态</th><th>延迟</th><th>成本</th></tr></thead><tbody>${models.map(x=>`<tr><td>${esc(x.task_type)}</td><td>${esc(x.provider)} / ${esc(x.model)}</td><td>${tag(x.status)}</td><td>${esc(x.latency_ms||0)} ms</td><td>¥${((x.cost_cny_fen||0)/100).toFixed(2)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">完成一次调度或 AgentRun 后会产生模型调用记录</div>'}`}

async function production(v){const programs=await api('/v1/pilot-programs');if(!programs.length){v.innerHTML=`${notice('生产试点门以真实证据和责任人签署为准。配置存在不等于通过。','warning')}<button class="btn primary" onclick="createPilot()">创建 Production Pilot</button>`;return}const p=programs[0];const [report,evidence,drills,atts]=await Promise.all([api(`/v1/pilot-programs/${p.id}/go-no-go`),api(`/v1/pilot-programs/${p.id}/evidence`),api(`/v1/pilot-programs/${p.id}/drills`),api(`/v1/pilot-programs/${p.id}/attestations`)]);const gates=['B','C','D','PRODUCTION'];v.innerHTML=`<div class="toolbar"><button class="btn primary" onclick="transitionPilot('${p.id}','${p.status==='DRAFT'?'ACTIVE':p.status==='ACTIVE'?'PAUSED':'ACTIVE'}')">${p.status==='DRAFT'?'启动试点':p.status==='ACTIVE'?'暂停试点':'恢复试点'}</button><button class="btn" onclick="recordStableDay('${p.id}')">记录稳定运行日</button><button class="btn" onclick="submitGateEvidence('${p.id}')">提交门禁证据</button><button class="btn" onclick="createPilotDrill('${p.id}')">登记演练</button><button class="btn" onclick="attestPilotGate('${p.id}')">责任人签署</button></div>${notice(`试点：<strong>${esc(p.name)}</strong> · 状态 ${esc(p.status)} · 当前结论 ${report.decision}`,report.decision==='GO'?'ok':'warning')}<div class="grid">${gates.map(g=>{const x=report.gates[g];return `<article class="card"><div class="row between"><strong>Gate ${g}</strong>${tag(x.ready?'READY':'BLOCKED')}</div><p class="muted">证据 ${x.verified_evidence.length}/${x.required_evidence.length} · 签署 ${x.approved_roles.length}/${x.required_roles.length}</p><div class="progress"><span style="width:${Math.round(((x.verified_evidence.length+x.approved_roles.length)/(x.required_evidence.length+x.required_roles.length))*100)}%"></span></div><p class="muted">缺失证据：${esc(x.missing_evidence.join(', ')||'无')}</p><p class="muted">缺失签署：${esc(x.missing_attestations.join(', ')||'无')}</p></article>`}).join('')}</div><h2 class="section">Go / No-Go 阻塞项</h2>${report.blockers.length?`<div class="stack">${report.blockers.map(x=>notice(esc(x),'error')).join('')}</div>`:notice('所有生产试点门已满足。','ok')}<h2 class="section">证据登记</h2>${evidence.length?`<table class="table"><thead><tr><th>Gate</th><th>类型</th><th>环境</th><th>状态</th><th>操作</th></tr></thead><tbody>${evidence.map(x=>`<tr><td>${esc(x.gate_key)}</td><td>${esc(x.evidence_type)}</td><td>${esc(x.environment)}</td><td>${tag(x.status)}</td><td>${x.status==='PENDING'?`<button class="btn sm" onclick="verifyPilotEvidence('${x.id}','VERIFIED')">验证</button> <button class="btn sm danger" onclick="verifyPilotEvidence('${x.id}','REJECTED')">驳回</button>`:''}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">尚无证据</div>'}<h2 class="section">演练与签署</h2><div class="two"><pre class="json">${esc(JSON.stringify(drills,null,2))}</pre><pre class="json">${esc(JSON.stringify(atts,null,2))}</pre></div>`}
async function createPilot(){const name=prompt('试点名称','WorkBuddy Production Pilot');if(!name)return;await api('/v1/pilot-programs',{method:'POST',body:{name,scope:{teams:['sales-growth','operations-delivery','customer-success']},targets:{}}});reload()}
async function transitionPilot(id,target){await api(`/v1/pilot-programs/${id}/transition`,{method:'POST',body:{target}});reload()}
async function recordStableDay(id){const d=prompt('日期 YYYY-MM-DD',new Date().toISOString().slice(0,10));if(!d)return;await api(`/v1/pilot-programs/${id}/metrics`,{method:'POST',body:{metric_date:d,metrics:{stable:true,sync_incidents:0,duplicate_messages:0}}});reload()}
async function submitGateEvidence(id){const gate=prompt('Gate: B / C / D / PRODUCTION','B');if(!gate)return;const type=prompt('证据类型（请按门禁要求填写）','cursor_recovery_drill');if(!type)return;await api(`/v1/pilot-programs/${id}/evidence`,{method:'POST',body:{gate_key:gate.toUpperCase(),evidence_type:type,source:'operator',environment:'production',metrics:{passed:true}}});reload()}
async function verifyPilotEvidence(id,decision){await api(`/v1/pilot-programs/evidence/${id}/decision`,{method:'POST',body:{decision,reason:decision==='VERIFIED'?'责任人已核验证据':'证据不足'}});reload()}
async function createPilotDrill(id){const type=prompt('演练类型','backup_restore_drill');if(!type)return;const d=await api(`/v1/pilot-programs/${id}/drills`,{method:'POST',body:{drill_type:type,execution_mode:'LIVE'}});const passed=confirm('演练是否通过？');await api(`/v1/pilot-programs/drills/${d.id}/complete`,{method:'POST',body:{passed,result:{operator_confirmed:true}}});reload()}
async function attestPilotGate(id){const gate=prompt('Gate: B / C / D / PRODUCTION','B');if(!gate)return;const role=prompt('签署角色','product_owner');if(!role)return;await api(`/v1/pilot-programs/${id}/attestations`,{method:'POST',body:{gate_key:gate.toUpperCase(),role,decision:'APPROVE',notes:'已核对当前证据快照'}});reload()}
function setToken(){const value=prompt('粘贴 Bearer JWT；留空清除',sessionStorage.getItem('workbuddy_token')||'');if(value)sessionStorage.setItem('workbuddy_token',value);else sessionStorage.removeItem('workbuddy_token');reload()}

async function createSubscription(){const plan=prompt('套餐 key: starter / growth / scale','starter');if(!plan)return;await api('/v1/commercial/subscriptions',{method:'POST',body:{plan_key:plan,billing_cycle:'monthly',trial_days:14,provider:'manual'}});reload()}

async function updateOnboarding(id){const key=prompt('要标记完成的清单项，例如 business_owner_assigned','business_owner_assigned');if(!key)return;await api(`/v1/commercial/onboardings/${id}/checklist`,{method:'PATCH',body:{updates:{[key]:true}}});reload()}

async function createSupportTicketUI(){const title=prompt('支持问题标题','同步异常');if(!title)return;const severity=prompt('严重级别 P0/P1/P2/P3','P2');await api('/v1/support/tickets',{method:'POST',body:{severity,category:'product',title,description:title}});reload()}

async function syncAccount(provider,id){const d=await api(`/v1/connectors/${provider==='graph'?'graph':'gmail'}/accounts/${id}/sync`,{method:'POST'});alert(JSON.stringify(d,null,2));reload()}
async function syncGmail(id){return syncAccount('gmail',id)}
async function watchAccount(provider,id){const d=await api(`/v1/connectors/${provider==='graph'?'graph':'gmail'}/accounts/${id}/watch`,{method:'POST'});alert(JSON.stringify(d,null,2));reload()}
async function exportData(){const d=await api('/v1/privacy/export');const blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='workbuddy-export.json';a.click();URL.revokeObjectURL(a.href)}
async function deleteData(){if(prompt('输入 DELETE OPERATIONAL DATA 以确认')!=='DELETE OPERATIONAL DATA')return;await api('/v1/privacy/delete-operational-data',{method:'POST',body:{confirmation:'DELETE OPERATIONAL DATA'}});setPage('dashboard')}
async function audit(v){const [rows,verify]=await Promise.all([api('/v1/audit?limit=300'),api('/v1/audit/verify')]);v.innerHTML=`${notice(verify.valid?'审计哈希链校验通过':'审计链在 '+verify.broken_at+' 处损坏',verify.valid?'ok':'error')}<table class="table"><thead><tr><th>时间</th><th>事件</th><th>对象</th><th>执行者</th><th>哈希</th></tr></thead><tbody>${rows.map(e=>`<tr><td>${esc(e.occurred_at)}</td><td><strong>${esc(e.action)}</strong><br><span class="muted">${esc(JSON.stringify(e.payload)).slice(0,120)}</span></td><td>${esc(e.aggregate_type)}<br><span class="muted">${esc(e.aggregate_id)}</span></td><td>${esc(e.actor_type)}:${esc(e.actor_id)}</td><td class="json">${esc(e.event_hash.slice(0,14))}…</td></tr>`).join('')}</tbody></table>`}
function showModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;modal.showModal()}
setPage('dashboard');

/* ===== 专家团工作区 (Task 7) ===== */
function showTeamWorkspace(teamKey){workspaceTeamKey=teamKey;workspaceExpandedMission=null;setPage('workspace')}
async function workspace(v){
  const tk=workspaceTeamKey;
  if(!tk){v.innerHTML=`<div class="empty">请从「公司看板」点击一个专家团卡片进入工作区。<br><button class="btn primary" style="margin-top:14px" onclick="setPage('dashboard')">返回公司看板</button></div>`;return}
  v.innerHTML='<div class="empty">正在加载工作区…</div>';
  try{
    const [ws,teamsRaw]=await Promise.all([api(`/v1/teams/${tk}/workspace`),api('/v1/teams')]);
    const team=teamsRaw.find(x=>x.team_key===tk)||{};
    window._ws={tk,ws,team,teams:teamsRaw,profileMap:{},teamIdMap:{}};
    teamsRaw.forEach(t=>window._ws.teamIdMap[t.id]={name:t.name,team_key:t.team_key});
    (team.agents||[]).forEach(a=>window._ws.profileMap[a.id]={role_key:a.role_key,name:a.name,is_lead:a.is_lead,status:a.status});
    window._ws.missions=await api(`/v1/teams/${tk}/missions?status_filter=${workspaceMissionFilter}`);
    window._ws.constitutions=await api(`/v1/teams/${tk}/constitutions`).catch(()=>[]);
    workspaceRender(v);
    if(refreshTimer)clearInterval(refreshTimer);
    refreshTimer=setInterval(()=>{if(page!=='workspace'||workspaceTeamKey!==tk)return;workspacePoll(tk)},15000);
  }catch(e){v.innerHTML=notice(esc(e.message),'error')}
}
function workspaceRender(v){
  const {ws,team}=window._ws;
  v.innerHTML=`<div class="row between" style="margin-bottom:14px"><button class="btn sm" onclick="setPage('dashboard')">← 返回看板</button><span class="muted" id="wsUpdatedAt">最后更新：${esc(new Date().toLocaleTimeString())}</span></div>${wsIdentityHTML(ws,team)}${wsConstitutionHTML()}${wsMembersHTML()}<div id="wsMissions">${wsMissionsHTML()}</div><div id="wsMissionDetail"></div>${wsSkillsHTML()}<div id="wsCollab">${wsCollabHTML()}</div>${wsMemoryHTML()}`;
}
async function workspacePoll(tk){
  try{
    const ws=await api(`/v1/teams/${tk}/workspace`);
    const missions=await api(`/v1/teams/${tk}/missions?status_filter=${workspaceMissionFilter}`);
    window._ws.ws=ws;window._ws.missions=missions;
    const u=$('#wsUpdatedAt');if(u)u.textContent='最后更新：'+new Date().toLocaleTimeString();
    const m=$('#wsMissions');if(m)m.innerHTML=wsMissionsHTML();
    const c=$('#wsCollab');if(c)c.innerHTML=wsCollabHTML();
    if(workspaceExpandedMission)renderWsMissionDetail(workspaceExpandedMission);
  }catch(e){}
}
function wsIdentityHTML(ws,team){
  const t=ws.team||{};const c=(ws.constitution&&ws.constitution.config)||{};
  const tools=c.allowed_tools||c.tools||[];
  return `<section class="card"><div class="row between"><div><div class="title">${esc(t.name||'')}</div><div class="muted" style="font-size:11px">team_key: ${esc(t.team_key||'')} · ${t.active===false?'已停用':'运行中'}</div></div>${tag(t.active===false?'INACTIVE':'ACTIVE')}</div><p style="margin:10px 0">${esc(t.mission||c.mission||'未设定使命')}</p><div class="two"><div><h4>职责范围 (in_scope)</h4><ul>${(c.in_scope||[]).length?(c.in_scope||[]).map(x=>`<li>${esc(x)}</li>`).join(''):'<li class="muted">未定义</li>'}</ul></div><div><h4>明确不负责 (out_of_scope)</h4><ul>${(c.out_of_scope||[]).length?(c.out_of_scope||[]).map(x=>`<li>${esc(x)}</li>`).join(''):'<li class="muted">未定义</li>'}</ul></div></div><p class="muted">主理人：${esc((team.agents||[]).find(a=>a.is_lead)?.name||'未配置')}</p><p class="muted">当前生效章程：${ws.constitution?`v${esc(ws.constitution.version)} · ${tag(ws.constitution.status)} · allowed_tools: ${esc(JSON.stringify(tools))}`:'未发布章程'}</p></section>`;
}
function wsConstitutionHTML(){
  const {tk,ws,constitutions}=window._ws;
  const cur=ws.constitution;const list=constitutions||[];
  const versions=list.map(v=>{
    let btn='';
    if(v.status==='draft')btn=`<button class="btn sm primary" onclick="constitutionAction('${v.id}','submit-review')">提交审核</button>`;
    else if(v.status==='reviewing')btn=`<button class="btn sm primary" onclick="constitutionAction('${v.id}','approve')">审核通过</button>`;
    else if(v.status==='approved')btn=`<button class="btn sm primary" onclick="constitutionAction('${v.id}','publish')">发布</button>`;
    else if(v.status==='published')btn=`<span class="tag green">当前生效</span>`;
    return `<tr><td>v${esc(v.version)}</td><td>${tag(v.status)}</td><td class="json">${esc((v.content_hash||'').slice(0,12))}…</td><td>${btn}</td></tr>`;
  }).join('');
  return `<section class="card" id="wsConstitution"><h3 style="margin-top:0">身份与章程</h3><p class="muted">当前生效章程（只读）：${cur?`v${esc(cur.version)} · ${tag(cur.status)}`:'无'}</p>${cur?`<details><summary class="muted">查看当前章程配置</summary><pre class="json">${esc(JSON.stringify(cur.config,null,2))}</pre></details>`:''}<div class="toolbar"><button class="btn primary" onclick="editConstitutionUI()">编辑新版本</button></div><div id="wsConstEditor"></div><h4>章程版本历史</h4>${list.length?`<table class="table"><thead><tr><th>版本</th><th>状态</th><th>哈希</th><th>操作</th></tr></thead><tbody>${versions}</tbody></table>`:'<p class="muted">暂无版本</p>'}</section>`;
}
function editConstitutionUI(){
  const cur=window._ws.ws.constitution;
  const base=cur?JSON.stringify(cur.config,null,2):JSON.stringify({mission:'',in_scope:[],out_of_scope:[],allowed_tools:[]},null,2);
  $('#wsConstEditor').innerHTML=`<form class="form" onsubmit="submitConstitutionDraft(event)" style="margin-top:10px"><label>新版本 config (JSON)<textarea id="constConfig" rows="10" class="json">${esc(base)}</textarea></label><div class="row"><button class="btn primary">创建草稿</button><button type="button" class="btn" onclick="$('#wsConstEditor').innerHTML=''">取消</button></div></form>`;
}
async function submitConstitutionDraft(e){
  e.preventDefault();const tk=window._ws.tk;
  let config;try{config=JSON.parse($('#constConfig').value)}catch(err){alert('JSON 解析失败：'+err.message);return}
  try{await api(`/v1/teams/${tk}/constitution/draft`,{method:'POST',body:{config}});await refreshWsConstitution(tk)}catch(err){alert(err.message)}
}
async function refreshWsConstitution(tk){
  try{const [ws,constitutions]=await Promise.all([api(`/v1/teams/${tk}/workspace`),api(`/v1/teams/${tk}/constitutions`).catch(()=>[])]);window._ws.ws=ws;window._ws.constitutions=constitutions;const el=$('#wsConstitution');if(el)el.outerHTML=wsConstitutionHTML()}catch(e){}
}
async function constitutionAction(id,action){
  try{await api(`/v1/teams/constitution/${id}/${action}`,{method:'POST'});await refreshWsConstitution(window._ws.tk)}catch(err){alert(err.message)}
}
function wsMembersHTML(){
  const members=window._ws.ws.members||[];
  return `<section class="card"><h3 style="margin-top:0">长期成员 (AgentProfile)</h3>${members.length?`<table class="table"><thead><tr><th>角色</th><th>姓名</th><th>身份</th><th>状态</th></tr></thead><tbody>${members.map(m=>`<tr><td><span class="muted">${esc(m.role_key)}</span></td><td><strong>${esc(m.name)}</strong></td><td>${m.is_lead?'<span class="tag purple">主理人</span>':'<span class="tag">长期成员</span>'}</td><td>${tag(m.status)}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">暂无成员</p>'}</section>`;
}
function wsMissionsHTML(){
  const missions=window._ws.missions||[];
  const filterBtns=`<div class="toolbar"><button class="btn sm ${workspaceMissionFilter==='active'?'primary':''}" onclick="setWsMissionFilter('active')">进行中</button><button class="btn sm ${workspaceMissionFilter==='all'?'primary':''}" onclick="setWsMissionFilter('all')">全部</button></div>`;
  return `<section><h2 class="section">Mission 列表</h2>${filterBtns}${missions.length?`<div class="stack">${missions.map(m=>{const p=m.workitem_progress||{};const pct=p.total?Math.round(p.completed/p.total*100):0;const title=m.title||((m.objective||'').slice(0,40))||m.id;return `<article class="card click" onclick="openWsMission('${m.id}')"><div class="row between"><strong>${esc(title)}</strong>${tag(m.status)}</div><p class="muted">${esc((m.objective||'').slice(0,100))}</p><div class="row between"><span class="muted">WorkItem 进度：${p.completed}/${p.total}</span><div class="progress" style="width:120px"><span style="width:${pct}%"></span></div></div></article>`}).join('')}</div>`:'<div class="empty">暂无 Mission</div>'}</section>`;
}
async function setWsMissionFilter(f){
  workspaceMissionFilter=f;
  try{window._ws.missions=await api(`/v1/teams/${window._ws.tk}/missions?status_filter=${f}`);const m=$('#wsMissions');if(m)m.innerHTML=wsMissionsHTML()}catch(e){alert(e.message)}
}
function openWsMission(id){
  if(workspaceExpandedMission===id){workspaceExpandedMission=null;const el=$('#wsMissionDetail');if(el)el.innerHTML='';return}
  workspaceExpandedMission=id;renderWsMissionDetail(id);
}
function renderWsMissionDetail(id){
  const el=$('#wsMissionDetail');if(!el)return;
  el.innerHTML='<div class="empty">加载 Mission 详情…</div>';
  api(`/v1/missions/${id}`).then(d=>{
    if(workspaceExpandedMission!==id)return;
    window._ws.missionDetail=d;
    el.innerHTML=wsMissionDetailHTML(d);
  }).catch(e=>{el.innerHTML=notice(esc(e.message),'error')});
}
function wsMissionDetailHTML(d){
  const m=d.mission||{};const pm=window._ws.profileMap||{};const team=window._ws.team||{};
  const leadName=(pm[m.lead_agent_profile_id]||{}).name||'未分配';
  const items=d.work_items||[];const runs=d.agent_runs||[];
  const itemsHTML=items.length?items.map(i=>{
    const prof=pm[i.assigned_agent_profile_id]||{};
    const itemRuns=runs.filter(r=>r.work_item_id===i.id);
    const runsHTML=itemRuns.length?itemRuns.map(r=>{
      const annot=r.context_cleared?'<span class="tag blue">上下文已清理，profile 复用</span>':'';
      const runProfile=(pm[r.agent_profile_id]||{}).name||r.agent_profile_id;
      return `<div class="workitem" style="margin:6px 0"><div class="row between"><span>执行实例 AgentRun</span>${tag(r.status)}</div><div class="muted" style="font-size:12px">${esc(runProfile)} · ${esc((r.id||'').slice(0,8))}</div>${r.context_cleared?`<div style="margin-top:4px">${annot}</div>`:''}${r.close_reason?`<div class="muted" style="font-size:12px">关闭原因：${esc(r.close_reason)}</div>`:''}</div>`;
    }).join(''):'<p class="muted" style="font-size:12px">暂无执行实例</p>';
    return `<div class="workitem"><div class="row between"><strong>${esc(i.title)}</strong>${tag(i.status)}</div><p class="muted" style="font-size:12px">${esc(i.objective)}</p><div class="muted" style="font-size:12px">子 agent（角色）：${prof.name?esc(prof.name)+' · '+esc(prof.role_key||''):'未分配 AgentProfile'}</div><div style="margin-top:6px"><div class="muted" style="font-size:12px;font-weight:600">执行实例：</div>${runsHTML}</div></div>`;
  }).join(''):'<div class="empty">主理人尚未创建任务清单</div>';
  const members=(team.agents||[]);
  const memberStatusHTML=members.length?members.map(a=>{
    const hasRunning=runs.some(r=>r.agent_profile_id===a.id&&r.status==='RUNNING');
    return `<tr><td>${a.is_lead?'<span class="tag purple">主理人</span>':'<span class="tag">成员</span>'}</td><td><strong>${esc(a.name)}</strong><br><span class="muted">${esc(a.role_key)}</span></td><td>${hasRunning?'<span class="tag amber">执行中</span>':'<span class="tag green">当前空闲，可接受新任务</span>'}</td></tr>`;
  }).join(''):'<tr><td colspan="3" class="muted">无成员</td></tr>';
  return `<section class="card"><div class="row between"><div><div class="title">${esc(m.title||'')}</div><div class="muted" style="font-size:12px">Mission v${esc(m.version)} · Plan v${esc(m.plan_version)}</div></div><div>${tag(m.status)} ${tag(m.risk_level)}</div></div><p>${esc(m.objective||'')}</p><div class="muted">主理人：${esc(leadName)}</div><h4>主理人 → 子 agent（角色）→ 执行实例</h4><div class="stack">${itemsHTML}</div><h4>长期成员状态（本 Mission 范围）</h4><table class="table"><thead><tr><th>身份</th><th>成员</th><th>执行状态</th></tr></thead><tbody>${memberStatusHTML}</tbody></table><details><summary class="muted">成果与审批</summary><h5>成果</h5>${(d.artifacts||[]).length?d.artifacts.map(a=>`<div class="workitem"><strong>${esc(a.title)}</strong></div>`).join(''):'<p class="muted">无</p>'}<h5>审批</h5>${(d.approvals||[]).length?d.approvals.map(a=>`<div class="workitem">${tag(a.status)} <strong>${esc(a.decision_question)}</strong></div>`).join(''):'<p class="muted">无</p>'}</details></section>`;
}
function wsSkillsHTML(){
  const skills=window._ws.ws.skills||[];
  return `<section class="card" id="wsSkills"><h3 style="margin-top:0">可用 Skill</h3><div class="toolbar"><label class="btn">上传 Skill<input type="file" accept=".yaml,.yml,.json,.md,.txt" style="display:none" onchange="wsUploadSkill(this.files[0])"></label></div>${skills.length?`<table class="table"><thead><tr><th>Skill</th><th>版本</th><th>来源</th><th>状态</th></tr></thead><tbody>${skills.map(x=>{const dd=x.definition||{},r=x.release||{};return `<tr><td><strong>${esc(dd.name||'')}</strong><br><span class="muted">${esc(dd.skill_key||'')}</span></td><td>${esc(r.semantic_version||'')}</td><td>${r.uploaded_by_user?'用户':'平台'}</td><td>${tag(r.status||'')}</td></tr>`}).join('')}</tbody></table>`:'<p class="muted">暂无可用 Skill</p>'}</section>`;
}
async function wsUploadSkill(file){
  if(!file)return;const fd=new FormData();fd.append('file',file);
  try{await api('/v1/skills/upload',{method:'POST',body:fd});const ws=await api(`/v1/teams/${window._ws.tk}/workspace`);window._ws.ws=ws;const el=$('#wsSkills');if(el)el.outerHTML=wsSkillsHTML()}catch(e){alert(e.message)}
}
function wsCollabHTML(){
  const collabs=window._ws.ws.collaborations||[];const teamId=(window._ws.team||{}).id;const teamIdMap=window._ws.teamIdMap||{};
  return `<h2 class="section">协作请求 (CollaborationRequest)</h2>${collabs.length?`<div class="stack">${collabs.map(c=>{
    const isSending=c.sending_team_id===teamId;const isReceiving=c.receiving_team_id===teamId;
    const role=isSending?'发起':'接收';
    const fromName=(teamIdMap[c.sending_team_id]||{}).name||c.sending_team_id;const toName=(teamIdMap[c.receiving_team_id]||{}).name||c.receiving_team_id;
    let actions='';
    if(isReceiving){
      if(c.status==='PENDING')actions=`<button class="btn sm primary" onclick="collabAction('${c.id}','accept')">接受</button><button class="btn sm danger" onclick="collabAction('${c.id}','decline')">拒绝</button>`;
      else if(c.status==='ACCEPTED')actions=`<button class="btn sm primary" onclick="collabAction('${c.id}','start')">启动工作</button>`;
      else if(c.status==='IN_PROGRESS')actions=`<button class="btn sm primary" onclick="collabAction('${c.id}','complete')">完成并回传</button>`;
    }else{actions='<span class="muted">只读（发起方）</span>'}
    return `<article class="card"><div class="row between"><strong>${esc(c.objective)}</strong>${tag(c.status)}</div><p class="muted">本团角色：${role} · ${esc(fromName)} → ${esc(toName)}</p><p class="muted">期望成果：${esc(c.expected_artifact)}</p>${c.response_reason?`<p class="muted">回复说明：${esc(c.response_reason)}</p>`:''}<div class="actions">${actions}</div></article>`;
  }).join('')}</div>`:'<div class="empty">暂无协作请求</div>'}`;
}
async function refreshWsCollab(){
  try{const ws=await api(`/v1/teams/${window._ws.tk}/workspace`);window._ws.ws=ws;const el=$('#wsCollab');if(el)el.innerHTML=wsCollabHTML()}catch(e){}
}
function collabAction(id,action){
  if(action==='decline'){showModal('拒绝协作请求',`<form class="form" onsubmit="doCollabDecline(event,'${id}')"><label>拒绝理由（必填）<textarea id="declineReason" required></textarea></label><button class="btn danger">确认拒绝</button></form>`);return}
  if(action==='complete'){showModal('完成并回传协作',`<form class="form" onsubmit="doCollabComplete(event,'${id}')"><label>成果 Artifact ID（必填）<input id="artifactId" required placeholder="artifact uuid"></label><button class="btn primary">完成并回传</button></form>`);return}
  api(`/v1/teams/${window._ws.tk}/collaborations/${id}/${action}`,{method:'POST'}).then(refreshWsCollab).catch(e=>alert(e.message));
}
async function doCollabDecline(e,id){e.preventDefault();try{await api(`/v1/teams/${window._ws.tk}/collaborations/${id}/decline`,{method:'POST',body:{reason:$('#declineReason').value}});modal.close();refreshWsCollab()}catch(err){alert(err.message)}}
async function doCollabComplete(e,id){e.preventDefault();try{await api(`/v1/teams/${window._ws.tk}/collaborations/${id}/complete`,{method:'POST',body:{artifact_id:$('#artifactId').value}});modal.close();refreshWsCollab()}catch(err){alert(err.message)}}
function wsMemoryHTML(){
  const mem=window._ws.ws.memories||[];
  return `<section class="card"><h3 style="margin-top:0">记忆 (MemoryRecord)</h3>${mem.length?`<table class="table"><thead><tr><th>类型</th><th>主题</th><th>状态</th><th>内容</th></tr></thead><tbody>${mem.map(x=>`<tr><td>${esc(x.memory_type)}</td><td>${esc(x.subject_key)}</td><td>${tag(x.status)}</td><td class="json">${esc(JSON.stringify(x.content)).slice(0,120)}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">暂无记忆</p>'}</section>`;
}
</script></body></html>
